version: 2
# Pull requests target the default branch (`main`): the repository is
# trunk-based and has no staging branch.
#
# Major versions are not proposed here (the ignore rules below): a major upgrade
# is planned work with its own issue. Security fixes for a major still arrive
# through security updates.
#
# No `labels:` on purpose: a label that does not exist makes Dependabot report
# an error on every run.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/station-console"
      - "/astro"
      - "/workers/mongo-bridge"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # Wait a week before proposing a newly published version: new releases
    # can be malicious or unstable (the scan job's
    # dependabot-missing-cooldown rule).
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/workers"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
