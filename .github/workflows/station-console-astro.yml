name: Station console (Astro)

# Slice 0 of the Next.js to Astro migration (mukoko-dev/mukoko-weather#293):
# type-check, unit tests, build and the Playwright smoke for
# station-console-astro/, against the mock backend. Path-filtered so the main
# app's CI is unaffected.
on:
  push:
    branches: [main, staging]
    paths:
      - "station-console-astro/**"
      - ".github/workflows/station-console-astro.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "station-console-astro/**"
      - ".github/workflows/station-console-astro.yml"

concurrency:
  group: station-console-astro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  console:
    name: Station console (Astro) - check, test, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: station-console-astro

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: station-console-astro/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Lint (tsc)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (WorkOS mode, as deployed)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (mock backend, mock session)
        run: npm run test:e2e
