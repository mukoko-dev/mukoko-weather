name: Workers

# The Rust weather backend in workers/ (mukoko-dev/mukoko-weather#148):
# format, lint (native and wasm32), test, and build every Worker bundle, plus
# typecheck and test of the TypeScript MongoDB bridge (workers/mongo-bridge).
# tests/fixtures/ is in the paths: the fixtures are the oracle the Rust tests
# assert (the Python that produced them is gone, #333), so a fixture change
# alone must run them.
on:
  push:
    branches: [main, staging]
    paths:
      - "workers/**"
      - "tests/fixtures/**"
      - "src/lib/locations.ts"
      - "src/lib/locations-global.ts"
      - "src/lib/icao-codes.ts"
      - ".github/workflows/workers.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "workers/**"
      - "tests/fixtures/**"
      - "src/lib/locations.ts"
      - "src/lib/locations-global.ts"
      - "src/lib/icao-codes.ts"
      - ".github/workflows/workers.yml"
  # The gate before a full deploy (workers-deploy.yml). It takes no ref
  # input: called from the deploy, it checks out github.sha, the same
  # main commit the deploy builds, never a caller-chosen ref.
  workflow_call:

# The event name keeps a deploy's gate out of the push/PR group, so a push
# can never cancel a gate that a deploy is waiting on.
concurrency:
  group: workers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: workers

jobs:
  check:
    name: Workers — fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable, wasm32)
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            workers/target
          key: workers-check-${{ hashFiles('workers/Cargo.lock') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Seed places are current
        working-directory: .
        run: node --experimental-strip-types workers/scripts/gen-seed-locations.mjs --check

      - name: Reference data is current
        working-directory: .
        run: node --experimental-strip-types workers/scripts/gen-reference-data.mjs --check

      - name: Season calendars are current
        working-directory: .
        run: node --experimental-strip-types workers/scripts/gen-seasons.mjs --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (native, logic)
        run: cargo clippy -p weather-core -p weather-mongo -p weather-webpush --all-targets -- -D warnings

      - name: Clippy (wasm32, every Worker)
        run: cargo clippy --workspace --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Test
        run: cargo test -p weather-core -p weather-mongo -p weather-webpush

  # The TypeScript Worker: typecheck and tests. It is bundled by wrangler at
  # deploy time (workers-deploy.yml), so there is no separate build here.
  mongo-bridge:
    name: Workers — mongo-bridge typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/mongo-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/mongo-bridge/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Workers — build ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        worker: [ai, forecast, internal-api, places, public-api, stations, aviation, jobs, tiles]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable, wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            workers/target
          key: workers-build-${{ matrix.worker }}-${{ hashFiles('workers/Cargo.lock') }}

      - name: Install worker-build
        run: command -v worker-build || cargo install --locked "worker-build@^0.8"

      - name: Build the bundle
        working-directory: workers/${{ matrix.worker }}
        run: worker-build --release

      # Workers allow 10 MB compressed on paid plans (3 MB free). Fail well
      # before either, so a Worker that grows gets split instead.
      - name: Bundle stays small
        working-directory: workers/${{ matrix.worker }}
        run: |
          size=$(gzip -c build/index_bg.wasm | wc -c)
          echo "gzipped wasm: ${size} bytes"
          test "$size" -lt 2000000
