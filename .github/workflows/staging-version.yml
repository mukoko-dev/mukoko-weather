# Versioning policy (nyuchi/.github#80): every merge into `staging` is
# released as the next PATCH, tagged on the merged commit.
name: Staging version

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump (major is only ever manual).
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  version:
    uses: nyuchi/.github/.github/workflows/reusable-staging-release.yml@925d067322defd676dacd90f2c2b0540cb10f644  # v0.11.1
    with:
      bump: ${{ inputs.bump || '' }}
    permissions:
      contents: write
