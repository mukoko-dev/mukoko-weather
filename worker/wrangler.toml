#:schema node_modules/wrangler/config-schema.json

name = "nyuchi-weather-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Domain: weather.mukoko.com
# Configure via Cloudflare Dashboard: Workers > nyuchi-weather-api > Custom Domains

# ───── KV Namespace Bindings ─────
# Weather data cache — short-lived cache of Open-Meteo responses
[[kv_namespaces]]
binding = "WEATHER_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Widget configuration cache — stores embed configs
[[kv_namespaces]]
binding = "WIDGET_CONFIGS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# ───── Environment Variables ─────
[vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "https://nyuchi.com,https://mukoko.com,https://weather.mukoko.com"
NEXT_APP_URL = "https://weather.mukoko.com"

# ───── AI ─────
# No AI route here: Shamwari is a signed-in feature served by the AI Worker
# (workers/ai) behind the app's /api/ai proxy, which the catch-all below
# reaches. This Worker holds no AI token and no service key.

# ───── Dev environment ─────
[env.dev]
name = "nyuchi-weather-api-dev"
[env.dev.vars]
ENVIRONMENT = "development"
CORS_ORIGINS = "*"
NEXT_APP_URL = "http://localhost:3000"

# ───── Staging environment ─────
[env.staging]
name = "nyuchi-weather-api-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
CORS_ORIGINS = "https://staging.weather.mukoko.com,https://staging.nyuchi.com"
NEXT_APP_URL = "https://staging.weather.mukoko.com"
