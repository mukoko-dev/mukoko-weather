# The Mukoko Weather backend: one Cargo workspace, several Workers
# (mukoko-dev/mukoko-weather#148). Shared logic lives in crates/; each
# Worker is its own crate with its own wrangler.jsonc and deploy.
[workspace]
resolver = "2"
members = [
  "crates/weather-core",
  "crates/weather-edge",
  "forecast",
  "internal-api",
  "public-api",
  "stations",
  "aviation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mukoko-dev/mukoko-weather"
publish = false

[workspace.dependencies]
weather-core = { path = "crates/weather-core" }
weather-edge = { path = "crates/weather-edge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "serde",
] }
worker = { version = "0.8", features = ["d1"] }
futures = { version = "0.3", default-features = false, features = [
  "std",
  "async-await",
] }
js-sys = "0.3"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = "2.6"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
