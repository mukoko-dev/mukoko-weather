[package]
name = "mukoko-weather-stations"
description = "mukoko-weather-stations: weather-station registration and ingest (Wunderground, Ecowitt, manual), queued into D1 and R2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
weather-core.workspace = true
weather-edge.workspace = true
worker = { workspace = true, features = ["queue"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
