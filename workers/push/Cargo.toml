[package]
name = "mukoko-weather-push"
description = "mukoko-weather-push: the Workers-runtime half of the Web Push sender (WebCrypto key agreement and VAPID signer, the fetch transport). Dark: one /health route, no schedule, no secret, not deployed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
weather-core.workspace = true
weather-edge.workspace = true
weather-webpush.workspace = true
worker.workspace = true
serde_json.workspace = true
js-sys.workspace = true
# The WebCrypto calls. Both are already in the lockfile through `worker`.
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Crypto",
  "CryptoKey",
  "CryptoKeyPair",
  "SubtleCrypto",
  "WorkerGlobalScope",
] }
