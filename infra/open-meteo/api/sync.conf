# Open-Meteo domains and variables synced from the AWS open-data bucket
# (https://openmeteo.s3.amazonaws.com/data/). One domain per line:
#
#   <domain> <comma-separated variables>
#
# Only what mukoko weather's forecast, minutely nowcast and CAMS air-quality
# requests need. No ERA5/archive: history uses an external API (owner decision).
# Variable names are the STORED ones, which differ from API names
# (e.g. wind_u/v_component_10m become wind_speed_10m + wind_direction_10m,
# relative_humidity_2m or dew_point_2m become each other). Sizes measured
# 2026-10-11 with --past-days 7; see README.md.
#
# Blend member ecmwf_ifs (ECMWF IFS HRES 9 km), ~32 GB
ecmwf_ifs temperature_2m,dew_point_2m,temperature_2m_max,temperature_2m_min,precipitation,showers,snowfall_water_equivalent,precipitation_type,pressure_msl,cloud_cover,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,shortwave_radiation,direct_radiation,cape,visibility
# Blend member ecmwf_aifs025_single (ECMWF AIFS), ~0.6 GB
ecmwf_aifs025_single temperature_2m,relative_humidity_2m,precipitation,showers,snowfall_water_equivalent,pressure_msl,surface_pressure,cloud_cover,wind_u_component_10m,wind_v_component_10m,shortwave_radiation
# Blend member gfs_seamless = ncep_gfs013 + ncep_gfs025 (only GFS has UV + lifted index), ~16 GB
ncep_gfs013 temperature_2m,relative_humidity_2m,precipitation,showers,snowfall_water_equivalent,frozen_precipitation_percent,cloud_cover,wind_u_component_10m,wind_v_component_10m,shortwave_radiation,diffuse_radiation,uv_index,uv_index_clear_sky
ncep_gfs025 pressure_msl,cape,lifted_index,visibility,wind_gusts_10m
# Blend member icon_global (DWD ICON), ~9 GB
dwd_icon temperature_2m,relative_humidity_2m,precipitation,rain,showers,snowfall_water_equivalent,pressure_msl,cloud_cover,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,shortwave_radiation,direct_radiation,diffuse_radiation,cape,weather_code
# Blend member gem_global (ECCC GEM). cmc_gem_gdps stopped updating on S3 in
# May 2026; cmc_gem_gdps_15km is the live domain. ~7 GB
cmc_gem_gdps_15km temperature_2m,relative_humidity_2m,precipitation,showers,snowfall_water_equivalent,pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,shortwave_radiation
# Blend member meteofrance_arpege_world (Meteo-France ARPEGE), ~1.6 GB
meteofrance_arpege_world025 temperature_2m,relative_humidity_2m,precipitation,snowfall_water_equivalent,pressure_msl,cloud_cover,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,shortwave_radiation,cape
# User-selectable / comparison models beyond the blend (KNOWN_FORECAST_MODELS):
# ecmwf_ifs025, and the European nests of icon_seamless and meteofrance_seamless
# (outside Europe those fall back to dwd_icon / arpege_world025). ~4.5 GB
ecmwf_ifs025 temperature_2m,dew_point_2m,temperature_2m_max,temperature_2m_min,precipitation,showers,snowfall_water_equivalent,pressure_msl,cloud_cover,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,shortwave_radiation,cape,visibility
dwd_icon_eu temperature_2m,relative_humidity_2m,precipitation,rain,showers,snowfall_water_equivalent,pressure_msl,cloud_cover,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,shortwave_radiation,direct_radiation,diffuse_radiation,cape,weather_code
meteofrance_arpege_europe temperature_2m,relative_humidity_2m,precipitation,snowfall_water_equivalent,pressure_msl,cloud_cover,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,shortwave_radiation,cape
# Ensemble precipitation probability for the members that publish one, ~1 GB
ncep_gefs025 precipitation_probability
ecmwf_ifs025_ensemble precipitation_probability
dwd_icon_eps precipitation_probability
# CAMS air quality (/v1/air-quality: PM, O3, NO2, SO2, CO, dust, AOD, UV).
# The API picks cams_europe inside Europe, which is also the only source of
# ammonia (NH3). ~0.9 GB
cams_global pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,dust,aerosol_optical_depth,uv_index
cams_europe pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,dust,ammonia
# 90 m terrain model for elevation downscaling of temperatures, ~10.5 GB, static
copernicus_dem90 static
